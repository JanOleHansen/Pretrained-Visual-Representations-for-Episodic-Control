[project]
name = "torchrl-hydra-template"
version = "0.1.0"
description = "TorchRL + Hydra RL research template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core deep learning
    "torch>=2.3.0",
    "torchrl>=0.5.0",
    "tensordict>=0.5.0",
    # Config management
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    # Environments
    "gymnasium[classic-control,mujoco]>=0.29.0",
    # Logging
    "wandb>=0.17.0",
    "tensorboard>=2.16.0",
    # Nearest-neighbour search (install faiss-gpu instead for GPU acceleration)
    "faiss-cpu>=1.7.0",
    # Utilities
    "tqdm>=4.66.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "scipy>=1.15.3",
    "ale-py>=0.12.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
# The two CLIP arms only: MFEC's frozen `encoder_name=clip`
# (src/encoders/clip_encoder.py) and NEC's finetuned
# `algorithm/embedding_network=clip_finetune` (src.networks.CLIPEmbedding).
# Kept out of the base dependencies on purpose: nothing else needs it, the test
# suite runs against a stub, and BOTH classes import it lazily inside
# __init__ so its absence costs every other encoder nothing.
#
# The lazy import matters more for CLIPEmbedding than for CLIPEncoder:
# src/networks.py is imported by src/algorithms/nec.py and by every
# DQN/DDPG/A2C config, so a module-scope `import open_clip` there would break
# the whole repo without this extra, not just the clip arm.  Pinned by
# tests/test_nec_clip_finetune.py.
# Install with:
#     uv sync --extra clip
clip = ["open_clip_torch>=2.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
