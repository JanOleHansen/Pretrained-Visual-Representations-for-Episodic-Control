defaults:
  - _self_
  - paths: default
  - algorithm: ???
  - environment: ???
  - environment@eval_environment: null   # optional eval env; falls back to environment
  - logger: wandb
  - experiment: null
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

# Run identity -> directory name: {algorithm}_{game}_{encoder}_seed{n}.
# Deterministic (no timestamp) so resuming from a checkpoint writes back into the
# same directory instead of creating a second TensorBoard run for one experiment.
# Experiment configs should override `algorithm` and `game` with short names;
# the defaults fall back to the selected config-group option.
# ALE game id for the game-generic environment configs (configs/environment/
# atari_mfec_*.yaml), which build `name: ALE/${game}-v5`.  One token per game,
# so a whole suite is a sweep rather than a directory of near-duplicate files:
#
#     python src/train.py -m experiment=mfec/clip game=Assault,BankHeist,RoadRunner
#
# Only the MFEC Ms. Pac-Man/Atari-3 arms read it; the DQN/DDPG/A2C experiments
# and the older mfec/{pong,qbert,breakout,hero} configs still name their env
# explicitly and ignore this.
game: MsPacman

run:
  algorithm: ${hydra:runtime.choices.algorithm}
  # Experiments on a game-generic env override this to ${game}; the rest fall
  # back to the env config's own name.  It must track the real game or a sweep
  # writes every arm to the same run.name and they collide.
  game: ${hydra:runtime.choices.environment}
  encoder: ${oc.select:algorithm.encoder_name,none}
  seed: ${trainer.seed}
  name: ${run.algorithm}_${run.game}_${run.encoder}_seed${run.seed}
  # `name` without the seed: the set of runs a multi-seed sweep should be
  # averaged over.  Consumed by the W&B logger's `group`, which is what lets
  # `-m trainer.seed=42,43,44,45,46` be plotted as one mean +/- SEM curve
  # instead of five separate ones (Blundell et al. 2016, Figure 1).
  group: ${run.algorithm}_${run.game}_${run.encoder}
  id: ${run.name}_${now:%Y%m%d-%H%M%S}


trainer:
  _target_: src.trainers.StepTrainer   # or src.trainers.EpisodeTrainer
  accelerator: cpu        # "cpu" | "gpu" | "mps"
  devices: [0]            # GPU indices; ignored when accelerator=cpu
  seed: 42
  # SHARED PROBE BUDGET.  total_frames / log_every_n_steps / eval_every_n_steps
  # are held identical here and in every configs/experiment/**.yaml, so any two
  # runs are read off the same x-axis at the same sample points.  Change them as
  # a set, and raise algorithm.buffer_size (MFEC) or
  # algorithm.replay_buffer.storage.max_size (DQN/DDPG/NEC) in lockstep with
  # total_frames — those are pinned equal to it so memory capacity never binds.
  total_frames: 100_000
  num_envs: 1             # number of parallel environments
  log_every_n_steps: 5_000
  eval_every_n_steps: 10_000  # periodic greedy-policy eval (see EvalCallback); null disables
  num_eval_episodes: 5       # episodes averaged per evaluation, when enabled

checkpoint:
  save_dir: ${paths.output_dir}/checkpoints
  save_every_n_steps: 50_000
  save_last: true
  resume_from: null       # path to .pt file to resume from

hydra:
  run:
    dir: ${paths.log_dir}/train/runs/${run.name}
  sweep:
    dir: ${paths.log_dir}/train/runs
    subdir: ${run.name}