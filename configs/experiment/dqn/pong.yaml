# @package _global_
# DQN on Atari Pong — mirrors the torchrl SOTA reference
# (https://github.com/pytorch/rl/blob/main/sota-implementations/dqn/dqn_atari.py).
# All algorithm hyperparameters live in configs/algorithm/dqn_atari.yaml;
# only trainer-side settings are overridden here.
defaults:
  - override /algorithm: dqn_atari
  - override /environment: pong_train
  - override /environment@eval_environment: pong_eval
  - override /logger: wandb
  - _self_

algorithm:
  # Replay capacity pinned to the 100k frame budget below — DQN/DDPG spell it
  # `replay_buffer.storage.max_size`, not MFEC's `buffer_size`.  At capacity ==
  # total_frames nothing is ever evicted, and LazyTensorStorage preallocates,
  # so the old 1e6 also committed 10x the RAM this run can fill.
  replay_buffer:
    storage:
      max_size: 100_000

trainer:
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [3]
  num_envs: 16
  log_every_n_steps: 5_000
  eval_every_n_steps: 10_000
  num_eval_episodes: 5
