# @package _global_
# NEC on ALE/MsPacman-v5 (Pritzel et al. 2017).
#
# This is the NEC analogue of experiment/mfec/mspacman.yaml. Note there is only
# ONE NEC Ms. Pac-Man config, whereas MFEC has three (mspacman / mspacman_vae /
# mspacman_dinov2). NEC's embedding network IS swappable, but via its own config
# group (configs/algorithm/embedding_network/) rather than per-experiment files:
#
#   python src/train.py experiment=nec/mspacman algorithm/embedding_network=<name>
#
# The two encoder systems are separate on purpose — MFEC's is frozen and keyed
# by `algorithm.encoder_name`, NEC's is trained jointly with the DND. This
# config uses the default (`nature`), the network from the paper.
#
# Ms. Pac-Man has 9 actions, so the nec_atari defaults (dnd_capacity=5e5 per
# action, k=50, embedding_dim=64, kernel_delta=1e-3, n_step=100, gamma=0.99)
# apply without change.
#
# Uses the dedicated mspacman_nec_* environments rather than mspacman_train /
# mspacman_eval because NEC must NOT clip rewards on this game — see the header
# of mspacman_nec_train.yaml for the paper citation.
defaults:
  - override /algorithm: nec_atari
  - override /environment: mspacman_nec_train
  - override /environment@eval_environment: mspacman_nec_eval
  - _self_

run:
  algorithm: nec
  game: mspacman

algorithm:
  # Paper §4 is "one replay update for every 16 observed frames" = 400 per
  # 1600 agent steps at action-repeat 4, which is also the reference's
  # learn_step=4. That is the nec_atari.yaml default. It is overridden DOWN here
  # on evidence: across three runs of this repo, the only one that reached ~3000
  # used 100, and the run that raised it to 400 plateaued at ~1000 by 270k steps
  # — worse, despite also getting the better eps_end.
  #
  # CORRECTION to an earlier version of this comment: it claimed "4x the
  # updates is 4x the encoder drift per collected frame". That is not what
  # happens. Measured drift per collector batch, in units of the mean
  # inter-state distance, under the settings in force at the time
  # (lr=1e-4, alpha=0.99, eps=1e-8, max_grad_norm=10):
  #
  #     num_updates:   25      50     100     200     400
  #     drift:       4.95x   4.93x   4.97x   5.07x   4.92x
  #
  # Drift is FLAT — it saturates within ~25 updates, because the clip bound on
  # 100% of updates and eps=1e-8 then moved every parameter by ~lr regardless
  # of gradient size. Lowering num_updates never addressed staleness. The fix
  # was the optimiser trio in nec_atari.yaml (lr=1e-5/0.9/0.01, no clipping),
  # which takes drift to ~1.1-1.7x at every update count above.
  #
  # This override is therefore kept on its two REAL justifications: the
  # empirical run evidence above, and throughput — it cuts the dominant cost
  # (num_updates x num_actions exact kNN scans per batch) by 4x. It remains a
  # deliberate deviation from §4 and must be declared alongside any comparison
  # to the paper's curves. Worth re-testing at 400 now that drift is fixed,
  # since §4's rate is 400 and the two were previously confounded.
  num_updates: 100

  # Training exploration floor. The paper only says "ε-greedy ... with a low ε"
  # (§3.2) and lists the rate among the swept-but-unreported values; the
  # reference implementation uses a constant 0.1. Neither pins it down, so this
  # is settled empirically: 0.001 is what the ONLY run of this repo that reached
  # ~3000 on Ms. Pac-Man used, and raising it to 0.05 cost ~40% of the score at
  # matched frames — that was the single learning-relevant change between those
  # two runs.
  eps_end: 0.001
  # The anneal deliberately outlasts the random warm-up: NEC only writes to the
  # DND at episode end, and while an action's table holds <= k entries its Q is
  # +inf (mapped to 1e9), so argmax degenerates. Annealing over 50k agent steps
  # (200k raw frames) keeps real exploration alive until the DND is populated.
  annealing_frames: 50_000
  init_random_frames: 12_500

  # Eval ε has to decorrelate episodes without describing a different policy
  # than training. ALE is deterministic here and NoopResetEnv does nothing on
  # this game (measured: 8 episodes with a fixed policy, std exactly 0), so ε is
  # the ONLY source of eval variance: at 0.001 ~55% of 700-step episodes replay
  # identically, at 0.005 ~3% do. 0.005 also stays within 10x of eps_end, so
  # train/* and eval/* describe the same policy and setup()'s mismatch warning
  # stays quiet.
  eval_eps: 0.005

trainer:
  # total_frames counts AGENT STEPS. The paper's x-axis counts RAW ALE FRAMES,
  # and action repeat is 4, so paper_frames = 4 x total_frames.
  #
  #   total_frames    paper x-axis   NEC Ms. Pac-Man (Fig. 6 / Table 3)
  #     250_000          1M frames     ~1500-2000
  #   1_000_000          4M frames     ~2500-3000   <- this run
  #   2_500_000         10M frames      4142.8      (Table 3, directly comparable)
  #
  # (An earlier comment here claimed 1_000_000 agent steps == 40M raw frames.
  # That is wrong by 10x: it is 4M. The 2_500_100 figure for 10M was correct.)
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # 8 rather than MFEC's 16. On top of the DND, NEC holds a 100k-transition
  # float32 replay buffer (~11 GB, preallocated by LazyTensorStorage) plus a
  # per-env raw-pixel carry buffer for the in-flight episode, and spawns one
  # worker process per env. 16 envs overruns the 32 GB devcontainer limit; the
  # OOM killer then takes out a ParallelEnv worker, which surfaces as
  # `EOFError: proc <pid> failed, last command: step_and_maybe_reset`.
  num_envs: 16
  log_every_n_steps: 10_000
  # 50_000 agent steps == every 200k raw frames, per paper §4 ("We evaluate
  # MFEC and NEC every 200.000 frames").
  eval_every_n_steps: 50_000
  num_eval_episodes: 10
