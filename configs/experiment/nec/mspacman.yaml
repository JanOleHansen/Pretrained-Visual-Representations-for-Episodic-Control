# @package _global_
# NEC on ALE/MsPacman-v5 (Pritzel et al. 2017).
#
# This is the NEC analogue of experiment/mfec/mspacman.yaml. Note there is only
# ONE NEC Ms. Pac-Man config, whereas MFEC has three (mspacman / mspacman_vae /
# mspacman_dinov2): MFEC's encoder is a swappable design choice, while NEC's
# CNN embedding network is trained jointly with the DND, so there is no encoder
# variant to select.
#
# Ms. Pac-Man has 9 actions, so the nec_atari defaults (dnd_capacity=5e5 per
# action, k=50, embedding_dim=64, kernel_delta=1e-3, n_step=100, gamma=0.99)
# apply without change.
#
# Uses the dedicated mspacman_nec_* environments rather than mspacman_train /
# mspacman_eval because NEC must NOT clip rewards on this game — see the header
# of mspacman_nec_train.yaml for the paper citation.
defaults:
  - override /algorithm: nec_atari
  - override /environment: mspacman_nec_train
  - override /environment@eval_environment: mspacman_nec_eval
  - _self_

run:
  algorithm: nec
  game: mspacman

algorithm:
  # Paper §4: "We do one replay update for every 16 observed frames with a
  # minibatch of size 32."  "Frames" throughout the paper are raw ALE frames —
  # fixed by its own remark that 40M frames "corresponds to 185 hours of
  # gameplay" (40e6 / 60fps = 185.2 h). With action-repeat 4 that is one update
  # per 4 agent steps, so frames_per_batch (1600 agent steps) / 4 = 400.
  # nec_atari.yaml's default of 100 assumes one collector step == one frame.
  num_updates: 400

  # The paper swept epsilon and never published the schedule (§4 lists the
  # "epsilon-greedy exploration-rate" among the swept-but-unreported values,
  # alongside the SGD learning rate, alpha, and the embedding dimensionality).
  # eps_end=1e-3 follows the NEC Atari setting reported in the episodic-control
  # literature. The anneal deliberately outlasts the random warm-up: NEC only
  # writes to the DND at episode end, and while an action's table holds <= k
  # entries its Q is +inf (mapped to 1e9), so argmax degenerates to action 0.
  # Annealing over 50k agent steps (200k raw frames) keeps real exploration
  # alive until the DND is populated.
  eps_end: 0.001
  annealing_frames: 50_000
  init_random_frames: 12_500

trainer:
  # 10_000_100 agent steps == 40M raw ALE frames, matching the paper's x-axis
  # and the MFEC Ms. Pac-Man run. For the directly-comparable Table 3 number
  # (NEC Ms. Pac-Man = 4142.8 at 10M frames) use total_frames=2_500_100.
  total_frames: 10_000_100
  seed: 42
  accelerator: gpu
  devices: [0]
  # 8 rather than MFEC's 16. On top of the DND, NEC holds a 100k-transition
  # float32 replay buffer (~11 GB, preallocated by LazyTensorStorage) plus a
  # per-env raw-pixel carry buffer for the in-flight episode, and spawns one
  # worker process per env. 16 envs overruns the 32 GB devcontainer limit; the
  # OOM killer then takes out a ParallelEnv worker, which surfaces as
  # `EOFError: proc <pid> failed, last command: step_and_maybe_reset`.
  num_envs: 8
  log_every_n_steps: 10_000
  # 50_000 agent steps == every 200k raw frames, per paper §4 ("We evaluate
  # MFEC and NEC every 200.000 frames").
  eval_every_n_steps: 50_000
  num_eval_episodes: 5
