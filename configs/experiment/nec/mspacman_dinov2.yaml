# @package _global_
# NEC on ALE/MsPacman-v5 with a FINETUNED DINOv2 ViT-S/14 as the embedding
# network — the PVM arm of the NEC encoder ablation against nec/mspacman.yaml
# (NatureEmbedding, the paper's ConvNet).
#
# This is nec/mspacman.yaml with the embedding-network group swapped and the
# trainer sized for the ViT.  Everything that defines the *task* — the env
# pair, gamma, n_step, reward scale, episode boundaries, exploration schedule —
# is held identical, so the encoder is the only variable.
#
# Difference from the MFEC DINOv2 arm (experiment/mfec/dinov2.yaml),
# and the reason this file exists at all:
#
#   * MFEC's DINOv2 is FROZEN, so it must be fed RGB single frames directly
#     (mspacman_mfec_*_dinov2 envs drop GrayScale/Resize).
#   * NEC's is FINETUNED, so it keeps the standard NEC env — 4 stacked 84x84
#     grayscale frames — and adapts them inside the module with a trainable
#     1x1 conv.  Keeping mspacman_nec_train/eval is what makes this a clean
#     ablation against nec/mspacman.yaml, and it preserves the frame stack,
#     which is the only source of velocity information NEC has.
defaults:
  - override /algorithm: nec_atari
  - override /environment: mspacman_nec_train
  - override /environment@eval_environment: mspacman_nec_eval
  - override /algorithm/embedding_network: dinov2_finetune
  - _self_

run:
  algorithm: nec
  game: mspacman
  # `run.encoder` defaults to ${oc.select:algorithm.encoder_name,none}, which
  # is an MFEC-only key — without this override the run directory would be
  # nec_mspacman_none_seed42, colliding with the NatureEmbedding arm.
  encoder: dinov2

algorithm:
  embedding_network:
    # No usable default: the .pth is a 90 MB download that does not belong in
    # the repo. Override on the CLI if your copy lives elsewhere:
    #   algorithm.embedding_network.weights_path=/path/dinov2_vits14_pretrain.pth
    # Same file the MFEC arm uses (experiment/mfec/dinov2.yaml).
    weights_path: /datahome/rschwinger/models/dinov2_vits14_pretrain.pth
    # Set repo_dir to a local clone of facebookresearch/dinov2 on a host with
    # no outbound network. torch.hub also reuses an already-downloaded
    # ~/.cache/torch/hub/facebookresearch_dinov2_main without touching the
    # network, so this is only needed on a cold offline box.
    repo_dir: null

  # Held identical to nec/mspacman.yaml — see that file for the evidence
  # behind each. Repeated rather than inherited because Hydra experiment
  # configs do not compose with each other.
  num_updates: 100
  eps_end: 0.001
  annealing_frames: 50_000
  init_random_frames: 12_500
  eval_eps: 0.005

trainer:
  # Same units and same budget as nec/mspacman.yaml: total_frames counts AGENT
  # STEPS, action repeat is 4, so this is 4M raw ALE frames.
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # 8, not the 16 of nec/mspacman.yaml. The ViT is resident on the same device
  # as the DND and every collector step runs a forward pass at batch=num_envs,
  # so num_envs sets the ViT's inference batch as well as the process count.
  # Halving it keeps peak activation memory clear of the 11.3 GB replay buffer
  # and the per-env raw-pixel carry. Raise it only after watching memory on the
  # target box — an OOM-killed ParallelEnv worker surfaces as
  # `EOFError: proc <pid> failed, last command: step_and_maybe_reset`.
  num_envs: 8
  log_every_n_steps: 10_000
  # Every 200k raw frames, per paper §4.
  eval_every_n_steps: 50_000
  # 10 in nec/mspacman.yaml. Each eval episode is up to 27,000 ViT forwards at
  # batch 1, which is the least amortised inference in the whole run; 5 still
  # averages over eval_eps=0.005's episode-to-episode variance.
  num_eval_episodes: 5
