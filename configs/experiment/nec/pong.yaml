
# @package _global_
# NEC on Atari Pong (Pritzel et al. 2017).
#
# Uses pong_mfec_train.yaml (no VecNorm) for the same reason as MFEC: the
# exact-match dict keys the DND on quantised CNN embeddings; VecNorm changes
# raw pixel values over time which would shift the embedding distribution and
# impair the exact-match hit rate (though less severely than for MFEC, since
# NEC's CNN is trainable and embeddings shift anyway as the network learns).
#
# Unlike nec/hero.yaml and nec/mspacman.yaml, this config KEEPS the clipped
# training env: Pong needs no NEC-specific variant because the paper notes its
# "original rewards are in the range [-1, 1]", so pong_mfec_train.yaml's
# SignTransform is a genuine no-op here rather than a deviation.
defaults:
  - override /algorithm: nec_atari
  - override /environment: pong_mfec_train
  - override /environment@eval_environment: pong_eval
  - _self_

# NO `algorithm:` block, deliberately: this config takes nec_atari.yaml's
# defaults wholesale, including num_updates: 400 (paper §4's rate — the twelve
# ablation arms override that DOWN to 100, this one does not).
#
# That inheritance used to be a bug rather than a choice. nec_atari.yaml carried
# annealing_frames: 4_000_000 and init_random_frames: 50_000, both sized for a
# paper-scale 10M-step run, so against the 100k probe budget below this config
# spent half the run on a uniform random policy and reached only eps = 0.975 by
# the end — the whole run was random play. Those defaults are now sized for the
# shared probe budget; see the comments on them in nec_atari.yaml. Pong has the
# longest random-policy episodes of any game here (922 agent steps, measured),
# so it is the game those defaults have the least margin on: the DND fills
# during the anneal rather than during the warm-up.
trainer:
  # Agent steps, not raw frames: with action-repeat 4 this is 400k raw ALE
  # frames — the shared probe budget, held identical across every experiment in
  # this repo. The paper's x-axis runs to 40M raw frames (total_frames:
  # 10_000_000), so scores off this budget are not comparable to its curves.
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # 8, matching every other NEC config — see the canonical note in
  # nec/mspacman.yaml for why num_envs is learning-relevant here (NEC writes to
  # the DND only at episode end, so trailing partial episodes are stranded in
  # proportion to num_envs). This was 16, which nec/mspacman.yaml documents as
  # OOMing on a 32 GB host: NEC adds a 100k-transition float32 replay buffer
  # (~11.3 GB preallocated) plus a per-env raw-pixel carry buffer on top of the
  # DND. If a run still dies with
  # `EOFError: proc <pid> failed, last command: step_and_maybe_reset`, that is
  # the OOM killer taking a ParallelEnv worker — drop further.
  num_envs: 8
  log_every_n_steps: 5_000
  # 10_000 agent steps == every 40k raw frames.  Paper §4 ("We evaluate MFEC and
  # NEC every 200.000 frames") is every 50_000 agent steps; shortened in
  # proportion to the 100k-step probe budget so a run still yields ten points.
  eval_every_n_steps: 10_000
  num_eval_episodes: 5
