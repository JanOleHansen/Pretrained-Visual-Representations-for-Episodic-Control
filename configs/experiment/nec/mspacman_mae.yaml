# @package _global_
# NEC on ALE/MsPacman-v5 with a FINETUNED MAE ViT-B/16 as the embedding network
# — the RECONSTRUCTION arm of the NEC encoder ablation, against
# nec/mspacman.yaml (NatureEmbedding, the paper's ConvNet),
# nec/mspacman_dinov2.yaml (self-distilled ViT) and nec/mspacman_clip.yaml
# (contrastive ViT).
#
# This is nec/mspacman.yaml with the embedding-network group swapped. The env
# pair, gamma, n_step, reward scale, episode boundaries and exploration
# schedule are all held identical, so the encoder is the only variable.
#
# WHY MAE IS THE ARM THAT MAKES THIS AN EXPERIMENT. DINOv2 and CLIP both
# optimise a *similarity* objective — self-distilled view agreement, image-text
# cosine similarity — so as a test of "what does the pretraining objective do to
# the geometry of an episodic-memory key" they are two flavours of one answer.
# MAE's objective is masked *pixel reconstruction*: nothing in its loss ever
# compares two images. It is the only arm that varies the causal variable, and
# the only one that can say whether NEC's DND needs a representation trained to
# place similar things nearby or merely one that retains information.
#
# MAE scoring BELOW the other PVMs is the hypothesis under test, not a defect.
# Its embeddings already start ~4.8x more tightly clustered than the paper's
# ConvNet — see the measured table in
# configs/algorithm/embedding_network/mae_finetune.yaml, and read it before
# diagnosing a slow start as a bug.
#
# Difference from the MFEC MAE arm (experiment/mfec/mae.yaml):
#   * MFEC's MAE is FROZEN, so it must be fed RGB single frames directly
#     (the atari_mfec_*_rgb env pair) at 224.
#   * NEC's is FINETUNED, so it keeps the standard NEC env — 4 stacked 84x84
#     grayscale frames — and adapts them inside the module with a trainable
#     1x1 conv. That keeps this a clean ablation against nec/mspacman.yaml and
#     preserves the frame stack, NEC's only source of velocity information.
#     It also runs at image_size=112 rather than 224, which matches the CLIP
#     arm's token count so the two PVM arms differ in objective and not in
#     compute; see mae_finetune.yaml for that argument.
#
# REQUIRES `timm`, an optional dependency:
#     uv sync --extra mae
defaults:
  - override /algorithm: nec_atari
  - override /environment: mspacman_nec_train
  - override /environment@eval_environment: mspacman_nec_eval
  - override /algorithm/embedding_network: mae_finetune
  - _self_

run:
  algorithm: nec
  game: mspacman
  # `run.encoder` defaults to ${oc.select:algorithm.encoder_name,none}, which
  # is an MFEC-only key — without this override the run directory would be
  # nec_mspacman_none_seed42, colliding with the NatureEmbedding arm.
  encoder: mae

algorithm:
  embedding_network:
    # null -> timm resolves `model_name` from the HuggingFace hub (needs
    # network). On an offline node, fetch the checkpoint once and point this at
    # the file; timm's checkpoint_filter_fn accepts the raw
    # facebookresearch/mae release as well as a timm .safetensors.
    weights_path: null
    # `.mae`, NOT `.mae_ft_in1k` — the latter adds supervised ImageNet
    # finetuning and would quietly make this a second supervised arm.
    model_name: vit_base_patch16_224.mae
    image_size: 112
    pooling: mean

  # Held identical to nec/mspacman.yaml — see that file for the evidence
  # behind each. Repeated rather than inherited because Hydra experiment
  # configs do not compose with each other.
  num_updates: 100
  eps_end: 0.001
  annealing_frames: 50_000
  init_random_frames: 12_500
  eval_eps: 0.005

trainer:
  # Same units and budget as nec/mspacman.yaml: total_frames counts AGENT
  # STEPS, action repeat is 4, so this is 4M raw ALE frames.
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # 8, matching nec/mspacman_dinov2.yaml and nec/mspacman_clip.yaml. num_envs
  # sets the ViT's inference batch as well as the process count, and the
  # backbone is resident on the same device as the DND and the replay buffer.
  num_envs: 8
  log_every_n_steps: 10_000
  # Every 200k raw frames, per paper §4.
  eval_every_n_steps: 50_000
  # DISK: MAE ViT-B/16 is 85.7M params, so each checkpoint is 686 MB early and
  # ~801 MB once the DND fills — weights, an equal-sized RMSProp square_avg,
  # and the DND's filled entries. At the default checkpoint.save_every_n_steps
  # of 50_000 a 1M-step run writes 20 of them, i.e. ~16 GB. Raise the interval
  # or prune if that does not fit.
  num_eval_episodes: 5
