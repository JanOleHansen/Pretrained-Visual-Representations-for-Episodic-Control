# @package _global_
# NEC on ALE/Frostbite-v5 (Pritzel et al. 2017) with the paper's ConvNet encoder.
#
# The Frostbite arm of the three-game NEC encoder ablation. The other two games
# are nec/mspacman.yaml and nec/qbert.yaml; the other two encoders for this game
# are nec/frostbite_dinov2.yaml and nec/frostbite_clip.yaml. Every
# learning-relevant setting below is held IDENTICAL across all twelve arms so that
# game and encoder are the only variables — do not tune one arm in isolation.
#
# Game choice: Frostbite is one of the five games of Blundell et al. §4.1, is
# named explicitly in Pritzel et al. §4 as a game where NEC's lack of reward
# clipping is what produces the result, and AGENTS.md ("Which games MFEC can
# work on at all") measures it at a 22% raw-frame repeat rate with
# exact_hit_rate 0.41 — the intersection of "MFEC demonstrably works" and "in
# the Atari-100k 26", together with Ms. Pac-Man and Q*bert.
#
# Frostbite has 18 actions, the most of the three games. Nothing needs to
# change — num_actions is read off the env spec in NECAlgorithm.setup() — but
# it is the most expensive of the three per gradient step, because the dominant
# cost is num_updates x |A| exact kNN scans, and the DND holds 18 tables rather
# than Ms. Pac-Man's 9. At dnd_capacity=5e4 that is 18 x 5e4 x 64 x 4 B = 230 MB
# of keys, which is not a memory concern; the throughput hit is the real one.
#
# Uses the dedicated frostbite_nec_* environments — there is no clipped
# `frostbite_train` in this repo, and there should not be one for NEC: see the
# header of frostbite_nec_train.yaml for why clipping would remove the exact
# behaviour the paper credits on this game.
defaults:
  - override /algorithm: nec_atari
  - override /environment: frostbite_nec_train
  - override /environment@eval_environment: frostbite_nec_eval
  - _self_

run:
  algorithm: nec
  game: frostbite

algorithm:
  # Held identical to nec/mspacman.yaml — that file carries the measurements
  # behind each of these four. Repeated rather than inherited because Hydra
  # experiment configs do not compose with each other.
  #
  # num_updates deviates from paper §4's rate of 400 per 1600 agent steps. Kept
  # on two grounds: the only run of this repo to reach ~3000 on Ms. Pac-Man used
  # 100, and it cuts the dominant per-batch cost by 4x — which matters most on
  # this game, with twice Ms. Pac-Man's action count. Declare the deviation
  # alongside any comparison to the paper's curves.
  num_updates: 100
  eps_end: 0.001
  # The anneal deliberately outlasts the random warm-up: NEC only writes to the
  # DND at EPISODE END, and while an action's table holds <= k = 50 entries its
  # Q is +inf, so the argmax has nothing to exploit until the first round of
  # episodes has been written. This matters more here than on the other two
  # games: with 18 actions the same number of episodes spreads over twice as
  # many tables, so each one fills at roughly half the rate.
  #
  # Both values are sized against trainer.total_frames below and must move with
  # it — see nec/mspacman.yaml for the full arithmetic. They were 50_000 /
  # 12_500, sized for a 1M-step run, which against the 100k probe budget put
  # ~26.6% of all collected frames on a uniform random action; 10_000 / 4_800
  # brings that to ~6.2%.
  #
  # Checked for this game specifically, since it is the one with the thinnest
  # margin: random-policy episode length is 371 agent steps (measured,
  # frostbite_nec_train), so at num_envs: 8 the 4_800-frame warm-up completes
  # one episode per env and leaves ~165 entries per action across the 18
  # tables — still >3x k. Watch train/dnd_size early anyway; if any table is
  # under 50 when the anneal ends, raise both together.
  annealing_frames: 10_000
  init_random_frames: 4_800
  # Large enough to decorrelate eval episodes on a deterministic ALE, small
  # enough to stay within 10x of eps_end so train/* and eval/* describe the same
  # policy.
  eval_eps: 0.005

trainer:
  # total_frames counts AGENT STEPS. The paper's x-axis counts RAW ALE FRAMES,
  # and action repeat is 4, so paper_frames = 4 x total_frames. 100k agent steps
  # = 400k raw frames — the shared probe budget, held identical across every
  # experiment in this repo. The paper's own table is at 10M raw frames, i.e.
  # total_frames: 2_500_000, so scores here are not comparable to it.
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # HELD IDENTICAL ACROSS ALL TWELVE ABLATION ARMS — canonical note in
  # nec/mspacman.yaml. Was 16 here while the PVM arms ran 8, which made num_envs
  # a second variable in an encoder comparison: NEC writes to the DND only at
  # EPISODE END, so ~num_envs x (mean episode length / 2) frames are stranded in
  # trailing partial episodes and never written. With Frostbite's measured
  # 371-step random-policy episodes that is ~3.0k frames (3.0%) at 16 envs
  # against ~1.5k (1.5%) at 8 — and the stranded frames are spread over 18
  # tables here, so they cost the thinnest ones most.
  num_envs: 8
  log_every_n_steps: 5_000
  # 10_000 agent steps == every 40k raw frames.  Paper §4 ("We evaluate MFEC and
  # NEC every 200.000 frames") is every 50_000 agent steps; shortened in
  # proportion to the 100k-step probe budget so a run still yields ten points.
  eval_every_n_steps: 10_000
  # HELD IDENTICAL ACROSS ALL TWELVE ABLATION ARMS. Was 10 here while the nine
  # PVM arms ran 5, which gave the baseline's eval/return_mean half the standard
  # error of the arms it is plotted against. 5 rather than 10 because each eval
  # episode is a full game (up to StepCounter's 27_000 steps) at batch 1, which
  # is the least amortised inference in the whole run.
  num_eval_episodes: 5
