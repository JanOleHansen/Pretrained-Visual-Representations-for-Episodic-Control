# @package _global_
# MFEC on ALE/MsPacman-v5 with a frozen ImageNet ResNet-18 as φ — the supervised
# PVM arm of the encoder ablation, against mspacman.yaml (random projection),
# mspacman_vae.yaml (paper-exact VAE) and mspacman_dinov2.yaml (self-supervised
# ViT).  The env pair is the paper-faithful MFEC one, so the arms differ *only*
# in the encoder.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: mspacman_mfec_train_rgb
  - override /environment@eval_environment: mspacman_mfec_eval_rgb
  - _self_

run:
  algorithm: mfec
  game: mspacman

algorithm:
  encoder_name: resnet
  # null -> torchvision downloads IMAGENET1K_V1 into ~/.cache/torch.  Set a path
  # on an offline cluster, the way dinov2_weights has to be set.
  # Key must match MFECAlgorithm.__init__'s parameter name exactly — Hydra
  # instantiate() passes these straight through as keyword arguments, so
  # `resnet_weights` (the name used until this was caught) is a TypeError.
  resnet_weights_path: null
  resnet_model_name: resnet18
  resnet_image_size: 224
  # Fixed by the backbone: 512 for resnet18/34, 2048 for resnet50/101/152.
  # ResNetEncoder reads the true value off fc.in_features; this only sizes the
  # zero-length fallback tensor in MFECAlgorithm, but keep it consistent.
  state_dim: 512
  # Held identical across every Ms. Pac-Man arm — see mspacman.yaml.
  buffer_size: 300_000

trainer:
  # UNITS: total_frames counts agent *decisions* (StepTrainer does
  # `self._step += batch.numel()`), while the paper's x-axis counts ALE emulator
  # frames at 4 per decision.  1M decisions = 4M emulator frames — the SAME
  # budget as every other Ms. Pac-Man arm.  This used to be 12.5M with
  # num_envs=4, which made a resnet-vs-dinov2 read a comparison of frame budgets
  # rather than of encoders.
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  num_envs: 16
  log_every_n_steps: 10_000
  eval_every_n_steps: 50_000
  # eval_eps=0.0 (see configs/algorithm/mfec_atari.yaml) makes every eval
  # episode identical on a deterministic ALE, so N>1 buys N copies of one
  # number at N times the cost.
  num_eval_episodes: 1
