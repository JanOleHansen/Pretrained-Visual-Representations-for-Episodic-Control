# @package _global_
# MFEC + paper-exact VAE encoder (Blundell et al. 2016, Appendix D) on
# ALE/MsPacman-v5.  Together with mspacman.yaml this is the paper's OWN encoder
# ablation — random projection vs VAE, the two phi choices of §3 — and it is the
# first half of research question C1.
#
# Pretrain the VAE first with src/train_vae.py, then pass its checkpoint here.
#
# ENV: uses the paper-faithful mfec pair, NOT mspacman_train_singleframe.
# atari_mfec_train.yaml is ALREADY a single 84x84 grayscale frame, so the
# VAE's paper-exact input (x in R^7056, in_channels=1) is satisfied by it
# directly.  mspacman_train_singleframe is derived from the DQN-style stack and
# drags in three things that are wrong here:
#   * SignTransform  — rewards clipped to {-1,0,+1}, so the QEC would store
#     pellet counts while every other arm stores true game score.  MFEC argmaxes
#     over raw Monte-Carlo returns, so this also flattens a ghost (200-1600) to
#     the value of a dot (10).  See "Reward scale for Atari MFEC runs".
#   * EndOfLifeTransform — inert here, but noise.
#   * StepCounter max_steps 4500 instead of 27,000 — a 5-minute episode cap.
# Pointing at the mfec pair makes the VAE arm directly comparable to
# mspacman.yaml: identical task, identical observations, only phi differs.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: atari_mfec_train
  - override /environment@eval_environment: atari_mfec_eval
  - _self_

run:
  algorithm: mfec
  game: ${game}

algorithm:
  encoder_name: vae
  vae_checkpoint: ???   # required: algorithm.vae_checkpoint=<path from src/train_vae.py>
  # embed() returns mean ++ log-std of a 32-dim latent = 64 values.
  state_dim: 64
  # Held identical across every arm and every game, and pinned equal to
  # trainer.total_frames — see rp_gray.yaml.
  buffer_size: 100_000

trainer:
  # UNITS: total_frames counts agent *decisions*; the paper's x-axis counts ALE
  # emulator frames at 4 per decision.  100k decisions = 400k emulator frames —
  # the shared probe budget, held identical across every experiment in this
  # repo, and a fortieth of Figure 1's 50M-frame x-range.
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [0]
  num_envs: 4
  log_every_n_steps: 5_000
  eval_every_n_steps: 10_000
  # 5, matching every NEC experiment and configs/train.yaml's default, so each
  # eval/return_mean in the study carries the same sample size and the same
  # standard error.
  #
  # Greedy eval (eval_eps=0.0) is not deterministic: NoopResetEnv draws 1-30
  # noops per reset and Ms. Pac-Man is not insensitive to them (measured on
  # atari_mfec_eval_rgb, 7 of 8 resets give a different first observation, and
  # one fixed action sequence returns [380, 170, 180, 340]).  N=1 would be a
  # single sample from a real distribution, with eval/return_std undefined
  # (BaseTrainer omits it at N=1).
  #
  # eval_eps is 0.0 for a separate reason (see configs/algorithm/mfec_atari.yaml
  # -- eps at eval understates the policy ~30% because MFEC cannot absorb one
  # off-trajectory action).
  num_eval_episodes: 5
