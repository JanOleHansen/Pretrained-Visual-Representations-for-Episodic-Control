
# @package _global_
# ============================================================================
# DEPRECATED — DO NOT USE FOR THE ENCODER ABLATION.
#
# This config predates the game-generic `game` variable and still points at the
# DQN-style env stack, which breaks MFEC in three documented ways at once:
#
#   * SignTransform     reward clipped to {-1,0,+1}. MFEC argmaxes over raw
#                       Monte-Carlo returns, so every scoring event becomes
#                       worth the same and episode_reward is not a game score.
#   * CatFrames N=4     4-frame stack. Blundell §3 embeds a SINGLE frame; a
#                       stack quadruples D and makes exact re-encounters —
#                       the thing Eq. (1) needs — strictly rarer.
#   * sticky actions    repeat_action_probability is left at v5's 0.25. Eq. (1)
#                       is max-over-returns, which footnote 1 calls "not suited
#                       to rational action selection in stochastic
#                       environments"; it latches onto lucky returns.
#
# Use the paper-faithful arms instead, which take the game as a variable:
#
#     python src/train.py experiment=mfec/rp_gray game=Pong
#
# See "The encoder ablation" in AGENTS.md.
# ============================================================================

# MFEC on Atari Pong — mirrors the torchrl SOTA reference
# (https://github.com/pytorch/rl/blob/main/sota-implementations/dqn/dqn_atari.py).
# All algorithm hyperparameters live in configs/algorithm/dqn_atari.yaml;
# only trainer-side settings are overridden here.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: pong_mfec_train
  - override /environment@eval_environment: pong_eval
  - _self_

algorithm:
  # QEC MEMORY — pinned to the 100k frame budget below, so capacity can never
  # bind: total insertions cannot exceed total_frames, and they spread over
  # |A| per-action tables, so LRU eviction never fires.
  buffer_size: 100_000

trainer:
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [3]
  num_envs: 16
  log_every_n_steps: 5_000
  eval_every_n_steps: 10_000
  # eval_eps=0.0 (see configs/algorithm/mfec_atari.yaml) makes every eval
  # episode identical on a deterministic ALE, so N>1 buys N copies of one
  # number at N times the cost.
  num_eval_episodes: 1
