# @package _global_
# MFEC on ALE/MsPacman-v5, set up to be directly comparable to Blundell et al.
# (2016) Figure 1.  Uses the paper-faithful env pair (single frame, no reward
# clipping, no sticky actions) rather than the DQN-style mspacman_train/eval
# configs.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: atari_mfec_train
  - override /environment@eval_environment: atari_mfec_eval
  - _self_

run:
  # Without these, run.name/run.group fall back to the Hydra choice names and
  # this arm reads "mfec_atari_atari_mfec_train_random_projection" while
  # every other arm reads "mfec_mspacman_<encoder>" — inconsistent on disk and
  # in W&B, where run.group is what a seed sweep is averaged over.
  algorithm: mfec
  game: ${game}

algorithm:
  # QEC MEMORY — held IDENTICAL across every arm AND every game, so the encoder
  # ablation differs only in phi.  This is the canonical comment; the other arms
  # point back here.
  #
  # QEC._init_states allocates (num_actions, buffer_size, state_dim) float32
  # eagerly, before a single frame is collected — so the cost scales with |A|,
  # which is a property of the GAME, not of the arm:
  #
  #     state_dim          |A|=9 (MsPacman)   |A|=18 (Frostbite)
  #     64  (rp)              0.23 GB              0.46 GB
  #     384 (dinov2)          1.38 GB              2.76 GB
  #     512 (resnet/clip)     1.84 GB              3.69 GB
  #
  # PINNED EQUAL TO trainer.total_frames.  That makes the bound structural
  # rather than empirical: a run inserts at most one QEC entry per decision, so
  # total insertions cannot exceed total_frames, and they spread over |A|
  # per-action tables — the per-action peak therefore FALLS as |A| rises, and
  # capacity can never bind on any game.  This matters because LRU eviction
  # firing would change the algorithm mid-run, at a different moment in each
  # arm, silently breaking the ablation.
  #
  # (It was 1.5e5 against a 1M-decision budget, sized off a measurement:
  # train/qec_size, the MEAN over actions, topped out ~40k with the busiest
  # action ~1.8x that.  The pin supersedes that headroom argument.)
  #
  # RAISE THIS IN LOCKSTEP if trainer.total_frames goes up — leaving it at 1e5
  # against a longer run reintroduces eviction.  Watch train/qec_size either way.
  buffer_size: 100_000

trainer:
  # UNITS: total_frames counts agent *decisions* (StepTrainer does
  # `self._step += batch.numel()`), while the paper's x-axis counts ALE
  # emulator frames at 4 per decision ("An hour of game play corresponds to
  # approximately 200,000 frames", §4.1).  So:
  #
  #     paper frames = 4 x (this axis)
  #
  # 100k decisions = 400k emulator frames — the Atari-100k protocol (see README,
  # "Choosing the game"), and the SHARED PROBE BUDGET held identical across every
  # experiment in this repo so the encoder ablation shares an x-axis.  Figure 1's
  # full x-range is 50M emulator frames = 12.5M decisions, so curves off this
  # budget cover its first ~1% and are not comparable to the paper's scores.
  total_frames: 100_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # PARALLEL ENVS.  MFEC writes to the QEC only at episode end (see
  # MFECAlgorithm._carry), so frames sitting in a trailing partial episode when
  # the run stops are never written at all.  The stranded amount is roughly
  # num_envs x (mean episode length / 2), i.e. ABSOLUTE — it hurts most at small
  # budgets.  Measured on Ms. Pac-Man over an 8,192-decision budget:
  #
  #     num_envs   episodes done   frames stranded   unique states kept
  #        1            12            193  ( 2%)          4,628
  #        4            13          1,676  (20%)          5,159
  #       16             7          5,041  (62%)          2,829
  #
  # The loss is ABSOLUTE, so at the 100k budget below it is ~1.7% for 4 envs and
  # ~5% for 16 — small, but ten times what it was at the old 1M budget, which is
  # the cost of the short probe.  The second column does not recover either: 16
  # envs kept 39% fewer unique states at equal frames, because they share one QEC
  # and eps=0.005, so they largely retread the same trajectory.
  #
  # 4 is the compromise the paper's Algorithm 1 (a single sequential stream)
  # trades against GPU efficiency: enough to keep a ViT forward batched for the
  # PVM arms, few enough that stranding and QEC staleness stay small.  Raise it
  # only if wall-clock hurts more than sample efficiency.
  num_envs: 4
  log_every_n_steps: 5_000
  eval_every_n_steps: 10_000
  # 5, matching every NEC experiment and configs/train.yaml's default, so each
  # eval/return_mean in the study carries the same sample size and the same
  # standard error (a per-arm N is the failure mode AGENTS.md records for the
  # NEC `nature` baseline, which ran 10 against the PVM arms' 5).
  #
  # This was 1, justified by "eval_eps=0.0 makes every eval episode identical
  # on a deterministic ALE".  That premise is FALSE.  NoopResetEnv draws 1-30
  # noops per reset and Ms. Pac-Man is not insensitive to them: measured on
  # atari_mfec_eval_rgb, 7 of 8 resets give a different first observation, and
  # one fixed action sequence returns [380, 170, 180, 340].  So every eval
  # point was a single sample from a real distribution -- which is why
  # eval/return_{min,mean,max} logged as one identical, wildly swinging curve
  # and why eval/return_std was never defined (BaseTrainer omits it at N=1).
  #
  # eval_eps stays 0.0: that argument is separate and still stands (see
  # configs/algorithm/mfec_atari.yaml -- eps at eval understates the policy
  # ~30% because MFEC cannot absorb one off-trajectory action).
  num_eval_episodes: 5