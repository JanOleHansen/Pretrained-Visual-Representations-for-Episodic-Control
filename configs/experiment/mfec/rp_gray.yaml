# @package _global_
# MFEC on ALE/MsPacman-v5, set up to be directly comparable to Blundell et al.
# (2016) Figure 1.  Uses the paper-faithful env pair (single frame, no reward
# clipping, no sticky actions) rather than the DQN-style mspacman_train/eval
# configs.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: atari_mfec_train
  - override /environment@eval_environment: atari_mfec_eval
  - _self_

run:
  # Without these, run.name/run.group fall back to the Hydra choice names and
  # this arm reads "mfec_atari_atari_mfec_train_random_projection" while
  # every other arm reads "mfec_mspacman_<encoder>" — inconsistent on disk and
  # in W&B, where run.group is what a seed sweep is averaged over.
  algorithm: mfec
  game: ${game}

algorithm:
  # QEC MEMORY — held IDENTICAL across every Ms. Pac-Man arm, so the encoder
  # ablation differs only in phi.  This is the canonical comment; the other arms
  # point back here.
  #
  # QEC._init_states allocates (num_actions, buffer_size, state_dim) float32
  # eagerly, before a single frame is collected.  With 9 Ms. Pac-Man actions:
  #
  #     state_dim  buffer 1e6   buffer 3e5
  #     64  (rp)      2.3 GB      0.69 GB
  #     384 (dinov2) 13.8 GB      4.15 GB
  #     512 (resnet/clip) 18.4 GB 5.53 GB
  #
  # 3e5 is chosen to sit safely ABOVE the peak, not to be tight: LRU eviction
  # must never fire, or the algorithm changes mid-run — and would change at a
  # different moment in each arm, which would silently break the ablation.
  # Measured at 1M decisions: train/qec_size (the MEAN over actions) tops out
  # ~40k, and the busiest action runs ~1.8x the mean, so the real peak is ~72k.
  # 3e5 is >4x that.
  #
  # WATCH train/qec_size on a longer budget.  It logs the mean, so treat
  # mean ~150k as the ceiling; past that, raise buffer_size (and the GPU).
  buffer_size: 300_000

trainer:
  # UNITS: total_frames counts agent *decisions* (StepTrainer does
  # `self._step += batch.numel()`), while the paper's x-axis counts ALE
  # emulator frames at 4 per decision ("An hour of game play corresponds to
  # approximately 200,000 frames", §4.1).  So:
  #
  #     paper frames = 4 x (this axis)
  #
  # 1M decisions = 4M emulator frames.  Figure 1's full x-range is 50M emulator
  # frames = 12.5M decisions; this is a tenth of that, held identical across
  # every arm so the encoder ablation shares an x-axis.  For the Atari-100k
  # protocol override to 100_000 (see README, "Choosing the game").
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # PARALLEL ENVS.  MFEC writes to the QEC only at episode end (see
  # MFECAlgorithm._carry), so frames sitting in a trailing partial episode when
  # the run stops are never written at all.  The stranded amount is roughly
  # num_envs x (mean episode length / 2), i.e. ABSOLUTE — it hurts most at small
  # budgets.  Measured on Ms. Pac-Man over an 8,192-decision budget:
  #
  #     num_envs   episodes done   frames stranded   unique states kept
  #        1            12            193  ( 2%)          4,628
  #        4            13          1,676  (20%)          5,159
  #       16             7          5,041  (62%)          2,829
  #
  # At the 1M budget below that same absolute loss is only ~0.5% for 4 envs and
  # ~2% for 16 — but the second column does not recover: 16 envs kept 39% fewer
  # unique states at equal frames, because they share one QEC and eps=0.005, so
  # they largely retread the same trajectory.
  #
  # 4 is the compromise the paper's Algorithm 1 (a single sequential stream)
  # trades against GPU efficiency: enough to keep a ViT forward batched for the
  # PVM arms, few enough that stranding and QEC staleness stay small.  Raise it
  # only if wall-clock hurts more than sample efficiency.
  num_envs: 4
  log_every_n_steps: 10_000
  eval_every_n_steps: 50_000   # 50k decisions = 200k emulator frames
  # eval_eps=0.0 (see configs/algorithm/mfec_atari.yaml) makes every eval
  # episode identical on a deterministic ALE, so N>1 buys N copies of one
  # number at N times the cost.
  num_eval_episodes: 1