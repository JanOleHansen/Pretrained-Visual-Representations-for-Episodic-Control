# @package _global_
defaults:
  - override /algorithm: mfec_atari
  - override /environment: breakout_train
  - override /environment@eval_environment: breakout_eval
  - _self_

trainer:
  total_frames: 1_000_000
  accelerator: gpu
  devices: [0]
  num_envs: 1
  eval_every_n_steps: 200_000   # paper §4: "evaluate MFEC and NEC every 200,000 frames"
  num_eval_episodes: 5