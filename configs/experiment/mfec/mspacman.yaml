# @package _global_
# MFEC on ALE/MsPacman-v5 — same hyperparameters as the Pong run.
# Ms. Pac-Man has 9 actions, so the mfec_atari defaults (buffer_size=1M,
# k=11, state_dim=64, gamma=0.99) apply without change.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: mspacman_train
  - override /environment@eval_environment: mspacman_eval
  - _self_

trainer:
  total_frames: 40_000_100
  seed: 42
  accelerator: gpu
  devices: [0]
  num_envs: 16
  log_every_n_steps: 10_000
  eval_every_n_steps: 200_000   # paper §4: "evaluate MFEC and NEC every 200,000 frames"
  num_eval_episodes: 5
