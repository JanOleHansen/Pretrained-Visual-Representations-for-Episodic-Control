# @package _global_
# MFEC on ALE/MsPacman-v5 with a frozen DINOv2 ViT-S/14 as φ — the PVM arm of
# the encoder ablation against mspacman.yaml (random projection) and
# mspacman_vae.yaml (paper-exact VAE).  The env pair is the paper-faithful MFEC
# one, so all three arms differ *only* in the encoder.
defaults:
  - override /algorithm: mfec_atari
  - override /environment: mspacman_mfec_train_dinov2
  - override /environment@eval_environment: mspacman_mfec_eval_dinov2
  - _self_

run:
  algorithm: mfec
  game: mspacman

algorithm:
  encoder_name: dinov2
  dinov2_weights: /datahome/rschwinger/models/dinov2_vits14_pretrain.pth
  dinov2_model_name: dinov2_vits14
  dinov2_repo_dir: null
  dinov2_image_size: 224
  state_dim: 384

trainer:
  # UNITS: total_frames counts agent *decisions* (StepTrainer does
  # `self._step += batch.numel()`), while the paper's x-axis counts ALE
  # emulator frames at 4 per decision.  So paper frames = 4 x (this axis), and
  # 12.5M decisions = 50M emulator frames = the full x-range of Figure 1 —
  # matching mspacman.yaml so the encoder arms share an x-axis.
  # (The previous 40_000_100 here was a units slip: that is 160M emulator
  # frames, 4x the paper budget.)
  total_frames: 1_000_000
  seed: 42
  accelerator: gpu
  devices: [0]
  # The paper runs a single sequential stream (Algorithm 1).  Every env in a
  # ParallelEnv acts on a QEC that is only updated at episode end, so a large
  # num_envs buys throughput at the cost of the one-shot latching that is the
  # whole point of episodic control.  4 matches mspacman.yaml; DINOv2 makes the
  # temptation to raise it stronger (the ViT forward is the bottleneck) but the
  # sample-efficiency cost is the same.
  num_envs: 16
  log_every_n_steps: 10_000
  eval_every_n_steps: 50_000
  # eval_eps=0.0 (see configs/algorithm/mfec_atari.yaml) makes every eval
  # episode identical on a deterministic ALE, so N>1 buys N copies of one
  # number at N times the cost.
  num_eval_episodes: 1