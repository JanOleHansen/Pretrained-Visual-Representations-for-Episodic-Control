_target_: src.algorithms.mfec.MFECAlgorithm

# Atari defaults from Blundell et al. (2016) §4.1.  The Labyrinth settings in
# §4.2 differ (k=50, gamma=0.99) — do not mix them up.
# "random_projection" | "vae" | "dinov2" | "resnet" | "clip" | "mae"
# ("clip" needs `uv sync --extra clip`, "mae" needs `uv sync --extra mae`)
encoder_name: random_projection
vae_checkpoint: null              # required when encoder_name=vae
# Encoder init seed — the only thing that fixes the random projection matrix.
# Tied to trainer.seed so one knob controls the whole run: leaving it null
# draws phi from OS entropy, so two runs with the same trainer.seed still use a
# different embedding space and are not comparable. Only affects
# encoder_name=random_projection; vae/dinov2/resnet/clip/mae load fixed weights.
seed: ${trainer.seed}
obs_key: pixels
buffer_size: 1_000_000            # §4.1: "limited to one million entries" per action
k: 11                             # §4.1: "The k-nearest-neighbour lookups used k = 11"
state_dim: 64                     # §4: "64 random-projections of the pixel observations"

# §4.1: "The discount rate was set to gamma = 1."  Atari rewards are sparse and
# episodes are long; with frame-skip 4 a gamma of 0.99 gives a ~100-decision
# (~27 s) horizon, which hides every long-range strategy from the QEC values.
gamma: 1.0

# §4.1: "Exploration is achieved by using an eps-greedy policy with eps = 0.005.
# We found that higher exploration rates were not as beneficial, as more
# exploration makes exploiting what is known harder."  Constant, not annealed —
# eps_start == eps_end makes the anneal a no-op.
eps_start: 0.005
eps_end: 0.005
annealing_frames: 1

# Evaluation exploration rate — 0.0, i.e. eval/* is a pure argmax rollout.
#
# This used to be 0.005 so that num_eval_episodes produced more than one
# distinct sample — believing the ALE deterministic at
# repeat_action_probability=0.0 *and* NoopResetEnv unable to change
# Ms. Pac-Man's score, so that a greedy rollout repeats itself.  The second
# half of that is FALSE (see below); eps is still not the way to buy samples.
# Measured cost of doing it that way, one QEC, 6 episodes:
#
#   eval_eps=0.000  [1440, 1440, 1440, 1440, 1440, 1440]  mean 1440
#   eval_eps=0.005  [ 490, 1440,  870,  550, 1440, 1440]  mean 1038
#
# MFEC cannot absorb a single off-trajectory action, so eps at eval understates
# the policy ~30%, leaves eval/return_max as the only honest statistic, and
# pins eval/return_min near the floor forever.  The eps=0.005 score §4.1
# reports is the *collector's* score and is already logged as
# train/episode_reward — nothing is lost by evaluating greedily here.
#
# CORRECTION — eval is NOT deterministic, and this used to say
# "set trainer.num_eval_episodes: 1" on the strength of that.  NoopResetEnv
# draws 1-30 noops per reset and Ms. Pac-Man does not absorb them: measured on
# atari_mfec_eval_rgb, 7 of 8 resets give a different first observation, and a
# single fixed action sequence returns [380, 170, 180, 340].  Every eval point
# was therefore one sample from a real distribution, which is what produced the
# identical, wildly swinging eval/return_{min,mean,max} curves and left
# eval/return_std undefined.  Every MFEC experiment now sets
# trainer.num_eval_episodes: 5, matching NEC and configs/train.yaml.
#
# Note this does NOT reopen eval_eps: the 1440-vs-1038 measurement above is
# about eps derailing the policy, not about sample count, and stands unchanged.
eval_eps: 0.0

# Divisible by every num_envs we use (1/2/4/8/16) so the collector does not
# silently round frames_per_batch up to a multiple of the env count.
frames_per_batch: 1_024
max_frames_per_traj: -1
key_scale: 100000