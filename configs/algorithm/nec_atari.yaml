# NEC on Atari — hyperparameters from Pritzel et al. (2017), Table S1.
# The paper's embedding network is the NatureDQN convolutional trunk (Mnih
# et al. 2015) with the Q-head replaced by a single dense layer — that is the
# `nature` option of the embedding_network config group, selected below.
# Swap it without editing this file:
#   python src/train.py experiment=nec/pong algorithm/embedding_network=<name>
defaults:
  - embedding_network: nature
  - _self_

_target_: src.algorithms.nec.NECAlgorithm

# Callable factories
#
# 1×10⁵ replay buffer on CPU (pixel obs are ~110 KB each; 10⁵ ≈ 11 GB uint8
# but ToTensorImage converts to float32 so actual storage is ~44 GB).
# Keep max_size=100_000 as in the paper; reduce for memory-constrained hosts.
replay_buffer:
  _partial_: true
  _target_: torchrl.data.TensorDictReplayBuffer
  storage:
    _target_: torchrl.data.LazyTensorStorage
    max_size: 100_000
    device: cpu

obs_key: pixels

# DND parameters (paper Table S1)
embedding_dim: 64        # h ∈ ℝ^64
dnd_capacity: 500_000    # 5×10⁵ entries per action
k: 50                    # p = 50 nearest neighbours
kernel_delta: 1.0e-3     # δ = 10⁻³
dnd_lr: 0.1              # α = 0.1 for blending existing entries

# N-step return (paper §2.2)
n_step: 100

# Optimisation
lr: 1.0e-4
gamma: 0.99
batch_size: 32
max_grad_norm: 10.0

# Exploration
eps_start: 1.0
eps_end: 0.01
annealing_frames: 4_000_000

# Data collection (same cadence as DQN Atari)
frames_per_batch: 1_600
init_random_frames: 50_000
max_frames_per_traj: -1

# 1 gradient update per 16 frames; 1600 / 16 = 100
num_updates: 100
