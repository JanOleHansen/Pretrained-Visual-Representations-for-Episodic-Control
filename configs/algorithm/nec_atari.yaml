# NEC on Atari — hyperparameters from Pritzel et al. (2017) §4.
#
# NOTE: this file used to cite "Table S1". There is no such table — the paper's
# only appendix is "A. Scores on Atari Games" and every hyperparameter is prose
# in §4. What §4 actually states is marked "(paper §4)" below; what it says it
# SWEPT and never reported is marked "(swept, unreported)". Do not re-add paper
# authority to the latter.
#
# The paper's embedding network is "the same convolutional architecture as DQN"
# (Mnih et al. 2015) with the Q-head replaced by a dense layer to the embedding
# width — that is the `nature` option of the embedding_network config group,
# selected below. Swap it without editing this file:
#   python src/train.py experiment=nec/pong algorithm/embedding_network=<name>
defaults:
  - embedding_network: nature
  - _self_

_target_: src.algorithms.nec.NECAlgorithm

# Callable factories
#
# 1×10⁵ replay buffer on CPU — "our replay buffer stores the only last 10^5
# states" (paper §4).  Memory: one obs is 4×84×84 = 28,224 elements, i.e.
# 28 KB as uint8 and 113 KB as the float32 ToTensorImage produces, so 10⁵
# transitions is ~11.3 GB (not the ~44 GB an earlier version of this comment
# claimed — it mistook the float32 per-frame size for the uint8 one).
# LazyTensorStorage preallocates, so that RAM is committed up front.
# Reduce max_size for memory-constrained hosts.
replay_buffer:
  _partial_: true
  _target_: torchrl.data.TensorDictReplayBuffer
  storage:
    _target_: torchrl.data.LazyTensorStorage
    max_size: 100_000
    device: cpu

obs_key: pixels

# DND parameters
embedding_dim: 64        # (swept, unreported) — §4 lists "dimensionality of
                         # the embeddings" among the swept hyperparameters
# (paper §4) "store up to 5 × 10^5 memories per action" — but that number is
# sized for the paper's 40M-frame runs, and capacity only does anything once a
# table is FULL. Measured insert rate on Ms. Pac-Man: train/dnd_size reaches
# 25,000 per action at 270k agent steps, i.e. ~0.093 entries/action/step, so a
# 1M-agent-step run ends at ~93k per action — 5e5 never fills, nothing is ever
# evicted, and the DND keeps keys written by the randomly-initialised encoder
# next to keys from the current one. The paper's own ratio is ~1.85 turnovers
# (10M agent steps -> ~930k inserts/action against 5e5), and 50k reproduces that
# at 1M steps. It also bounds the exact-kNN cost, which is linear in table size
# and is the dominant throughput term (see AGENTS.md 5b).
#
# Raise it for longer runs: capacity ~= 0.093 * total_frames / 1.85.
#
# NOTE — this value is what makes eviction reachable at all (tables fill at
# ~450k agent steps, vs ~4.5M at the paper's 5e5), so it is coupled to the
# eviction POLICY. That policy was FIFO when this was first set to 50k, on a
# rationale that only held while nothing was ever evicted; it is now LRU per
# §3.3 (see AGENTS.md 4b). Do not lower this further without re-reading that
# section — under LRU a small capacity is much safer, because what survives
# is what the kNN actually retrieves.
dnd_capacity: 50_000
k: 50                    # (paper §4) "we set the number of nearest neighbours
                         # p = 50 in all our experiments"
# (paper §4, Eq. 5) "we set δ = 10^-3". δ is a SQUARED DISTANCE, so it is only
# meaningful relative to the embedding scale, and this repo L2-normalises (the
# paper and the reference do not): measured, δ is ~17% of the mean squared
# distance to the k=50 neighbours here vs ~0.003% in the reference's geometry.
# δ=1e-5 was tried — it lifts an exact re-encounter from 5.6% to 45% of the
# kernel mass but did not improve retrieval (r +0.50 -> +0.51) or the score, so
# the published value stands.
kernel_delta: 1.0e-3
dnd_lr: 0.1              # (swept, unreported) — §4's "fast-update learning-rate α"
# Gradient learning rates for the stored DND keys/values. Paper Fig. 2:
# "Gradients flow through the entire architecture" — the regression loss
# updates the DND, not just the CNN. (swept, unreported); §3.4 only constrains
# the value rate to sit below the fast-update rate α.
dnd_key_lr: 1.0e-4
dnd_value_lr: 1.0e-5

# N-step return
n_step: 100              # (paper §4) "for the N-step Q estimates we picked a
                         # horizon of N = 100"

# Optimisation
# RMSProp per paper §4 ("we used the RMSProp algorithm"); §4 publishes no
# numbers, so these are the DeepMind trio the reference implementation uses:
# RMSPropOptimizer(1e-5, decay=0.9, epsilon=0.01).
#
# THESE FOUR VALUES MOVE TOGETHER (lr, alpha, eps, max_grad_norm) — see below.
#
# They replace torch's defaults (1e-4 / 0.99 / 1e-8 + clip 10), under which the
# DND was not usable as a memory. Measured encoder drift per collector batch,
# in units of the mean distance between distinct states:
#
#     num_updates    old (1e-4/.99/1e-8/clip10)    this (1e-5/.90/.01)
#        25                  4.95x                       1.13x
#       100                  4.97x                       1.66x
#       400                  4.92x                       1.07x
#
# ~5x the inter-state distance exceeds the diameter of the unit sphere the
# embeddings live on, so keys written one batch pointed nowhere by the next.
# That is what drove eval/dnd_top_weight toward 1/k, collapsed
# train/dnd_blend_rate, and made train/q_loss rise rather than converge.
# Note the old drift is FLAT in num_updates (it saturates within ~25 updates),
# so lowering num_updates does not address it — only these settings do.
lr: 1.0e-5
rmsprop_alpha: 0.9
rmsprop_eps: 0.01
gamma: 0.99              # (paper §4) "all algorithms were trained using
                         # discount rate γ = 0.99"
batch_size: 32           # (paper §4) "with a minibatch of size 32"
# Gradient clipping, DISABLED — neither the paper nor the reference clips.
# At the previous threshold of 10 it bound on 100% of updates (median raw grad
# norm ~1.7e3), making it the de-facto step size: every step became the same
# magnitude regardless of gradient, which with rmsprop_eps=1e-8 moved every
# parameter by ~lr every update. That is the mechanism behind the saturating
# 4.9x drift above. It was only load-bearing because eps=1e-8 damps nothing
# (removing both at once diverges: q_loss 1.5e3 -> 1.9e4 in three batches);
# eps=0.01 damps the step on its own. Re-enable only with a matching eps.
max_grad_norm: null

# Exploration — (swept, unreported); §4 lists the "ε-greedy exploration-rate"
# among the swept values.
#
# ANNEALING_FRAMES IS SIZED FOR THE SHARED 100k PROBE BUDGET, not for the
# paper's runs. It counts AGENT STEPS, like trainer.total_frames, so the two
# are only meaningful relative to each other. This was 4_000_000 — sized for a
# 10M-agent-step paper-scale run — while configs/train.yaml's shared probe
# budget is total_frames: 100_000. At that pairing epsilon reaches only
# 1 - 0.99 * 100e3/4e6 = 0.975 by the END of the run, i.e. the whole run is
# uniform random play. Any experiment config that did not override it inherited
# exactly that (nec/pong.yaml and nec/hero.yaml both did, until this was fixed).
#
# The binding constraint on the low side is that the anneal must outlast the
# point where the DND becomes usable: NEC writes only at EPISODE END, and an
# action holding <= k = 50 entries answers +inf, so the argmax has nothing to
# exploit until the first round of episodes has been written. Measured episode
# length under a random policy on the real NEC env stacks (agent steps):
#
#     Q*bert 314   Frostbite 371   Ms. Pac-Man 498   H.E.R.O. 656   Pong 922
#
# At num_envs: 8 the first round of episodes therefore completes between ~2.5k
# and ~7.4k collected frames, and lands 165-1230 entries per action — all well
# past k. 10_000 clears the slowest game (Pong) with margin and puts epsilon at
# its floor by 10% of the probe budget.
#
# RAISE THIS IN LOCKSTEP with trainer.total_frames. For a paper-scale run
# (total_frames: 2_500_000 for the 10M-raw-frame table) restore 4_000_000.
eps_start: 1.0
eps_end: 0.01
annealing_frames: 10_000

# Evaluation exploration rate (get_policy()). NOT annealed, and deliberately
# LARGER than the training floor. ALE is deterministic here
# (repeat_action_probability=0.0) and NoopResetEnv does not perturb the opening,
# so an episode of length L replays pure argmax with probability
# (1 - eval_eps)^L: at 0.001 and L=600 that is 55% of episodes identical, which
# makes eval/return_min ~= eval/return_max and num_eval_episodes worthless.
# 0.05 is the Mnih et al. (2015) evaluation rate, whose preprocessing Pritzel
# et al. §4 adopt; the NEC paper states no evaluation epsilon of its own.
# Set 0.0 for pure argmax.
eval_eps: 0.05

# Data collection.  frames_per_batch counts AGENT STEPS, and every Atari config
# here runs action-repeat 4, so 1600 agent steps == 6400 raw ALE frames.
frames_per_batch: 1_600

# ALSO SIZED FOR THE 100k PROBE BUDGET — read the annealing_frames note above
# first; the two move together. This was 50_000, i.e. HALF of the shared budget
# spent on a uniform random policy before the collector ever consults the DND.
#
# Two constraints fix the value:
#
#   * 4_800 = exactly 3 collector batches at frames_per_batch: 1_600. torchrl
#     warns and rounds UP when init_random_frames is not a multiple of
#     frames_per_batch (collectors/_single.py), so the previous 12_500 the
#     experiment configs used was silently 12_800.
#   * At num_envs: 8 that is 600 agent steps per env, which completes the first
#     episode on every ablation game (Q*bert 314, Frostbite 371, Ms. Pac-Man
#     498 — see the measured table above), so the DND is non-empty and past
#     k = 50 on every action before the first gradient step runs. Pong (922)
#     and H.E.R.O. (656) fill during the anneal instead, which is why
#     annealing_frames is set to outlast them.
#
# The paper and the reference implementation have NO warm-up at all — both act
# epsilon-greedily from step 0 (AGENTS.md, "Deviations that are not
# numerical"). This exists only to keep the optimistic-init argmax off an empty
# table; it is not a paper-sanctioned knob and should not grow.
init_random_frames: 4_800
max_frames_per_traj: -1

# (paper §4) "we do one replay update for every 16 observed frames".  "Frames"
# in the paper are raw ALE frames — fixed by its own remark that 40M frames
# "corresponds to 185 hours of gameplay" (40e6 / 60fps = 185.2 h).  With
# action-repeat 4: 1600 agent steps = 6400 raw frames, 6400 / 16 = 400.
# This was 100 until review — that value assumed 1 agent step == 1 raw frame,
# which is true for no Atari config in this repo, so pong/hero were doing 4x
# too few gradient updates.
num_updates: 400
