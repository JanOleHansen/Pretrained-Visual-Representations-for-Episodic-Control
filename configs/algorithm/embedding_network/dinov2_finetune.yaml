# NEC embedding network: finetunable DINOv2 ViT.
#
# ***SCAFFOLDING — UNVALIDATED. No training run has ever used this.***
# Composition, construction, forward shape and the freeze_backbone flag are
# covered by tests/test_nec_embedding_network.py (against a STUB backbone,
# no downloads). Everything else — real weight loading, whether 84x84
# Atari frames upsampled to 224 are sensible ViT input, whether NEC learns
# with it — is unverified. See src/networks.py::DINOv2Embedding.
#
# Unlike MFEC's `encoder_name=dinov2` (frozen, src/encoders/dino_v2_encoder.py),
# this variant is trainable end-to-end: `freeze_backbone: false` by default,
# which is the entire reason a NEC-specific class exists.
#
#   python src/train.py experiment=nec/mspacman \
#       algorithm/embedding_network=dinov2_finetune \
#       algorithm.embedding_network.weights_path=/path/dinov2_vits14_pretrain.pth \
#       run.encoder=dinov2
#
# Set `run.encoder` explicitly (as above, or in the experiment config) so the
# run directory name distinguishes it from a `nature` run — `run.encoder`
# reads `algorithm.encoder_name`, which is an MFEC-only key.
_partial_: true
_target_: src.networks.DINOv2Embedding

# Required: a torch.save(state_dict) of the pretrained backbone. Left as a
# mandatory value so a run without it fails at instantiation rather than
# silently training a randomly-initialised ViT.
weights_path: ???

model_name: dinov2_vits14     # vits14=384 ... vitg14=1536 backbone width
repo_dir: null                # local clone of facebookresearch/dinov2 (offline hosts)
image_size: 224               # must be a multiple of 14
freeze_backbone: false        # true -> train only the channel adapter + head
