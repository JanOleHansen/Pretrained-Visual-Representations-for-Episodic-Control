_target_: src.algorithms.nec.NECAlgorithm

# Callable factories (override via nested configs; requires instantiate(cfg.algorithm)).
embedding_network:
  _partial_: true
  _target_: src.networks.NatureEmbedding
  num_cells_cnn: [32, 64, 64]
  kernel_sizes: [8, 4, 3]
  strides: [4, 2, 1]
  activation_class:
    _target_: hydra.utils.get_class
    path: torch.nn.ReLU

replay_buffer:
  _partial_: true
  _target_: torchrl.data.TensorDictReplayBuffer
  storage:
    _target_: torchrl.data.LazyTensorStorage
    max_size: 100_000
    device: cpu

obs_key: pixels

# DND parameters
embedding_dim: 64
dnd_capacity: 500_000
k: 50
kernel_delta: 1.0e-3   # δ in kernel k(h,h_i) = 1/(‖h−h_i‖²+δ)
dnd_lr: 0.1            # α for blending existing entries on write

# N-step return
n_step: 100

# Optimisation
lr: 1.0e-4
gamma: 0.99
batch_size: 32
max_grad_norm: 10.0

# Exploration (epsilon-greedy, linear anneal in frames)
eps_start: 1.0
eps_end: 0.01
annealing_frames: 4_000_000

# Data collection
frames_per_batch: 1_600
init_random_frames: 50_000
max_frames_per_traj: -1

# Learning schedule
num_updates: 100    # gradient steps per collector batch (≈1 per 16 frames)
