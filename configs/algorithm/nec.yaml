# The embedding network is a first-class config group
# (configs/algorithm/embedding_network/). Swap it without editing this file:
#   python src/train.py algorithm=nec algorithm/embedding_network=nature
defaults:
  - embedding_network: nature
  - _self_

_target_: src.algorithms.nec.NECAlgorithm

# Callable factories (override via nested configs; requires instantiate(cfg.algorithm)).
replay_buffer:
  _partial_: true
  _target_: torchrl.data.TensorDictReplayBuffer
  storage:
    _target_: torchrl.data.LazyTensorStorage
    max_size: 100_000
    device: cpu

obs_key: pixels

# DND parameters
# (Same values as nec_atari.yaml; see that file for which of these the paper
# actually specifies and which it swept without reporting.)
embedding_dim: 64
dnd_capacity: 500_000
k: 50
kernel_delta: 1.0e-5   # δ in kernel k(h,h_i) = 1/(‖h−h_i‖²+δ);
                       # scaled for L2-normalised keys, see nec_atari.yaml
dnd_lr: 0.1            # α for blending existing entries on write
# Gradient learning rates for the stored DND keys/values (paper Fig. 2:
# "gradients flow through the entire architecture"). Not published — §4 sweeps
# the SGD learning rate without reporting it; §3.4 only says the value rate is
# below the fast-update rate α.
dnd_key_lr: 1.0e-4
dnd_value_lr: 1.0e-5

# N-step return
n_step: 100

# Optimisation
lr: 1.0e-5             # RMSProp, reference values (see nec_atari.yaml)
rmsprop_alpha: 0.9
rmsprop_eps: 0.01
gamma: 0.99
batch_size: 32
max_grad_norm: 10.0

# Exploration (epsilon-greedy, linear anneal in frames)
eps_start: 1.0
eps_end: 0.01
annealing_frames: 4_000_000

# Evaluation exploration rate (get_policy()). NOT annealed, and deliberately
# LARGER than the training floor. ALE is deterministic here
# (repeat_action_probability=0.0) and NoopResetEnv does not perturb the opening,
# so an episode of length L replays pure argmax with probability
# (1 - eval_eps)^L: at 0.001 and L=600 that is 55% of episodes identical, which
# makes eval/return_min ~= eval/return_max and num_eval_episodes worthless.
# 0.05 is the Mnih et al. (2015) evaluation rate, whose preprocessing Pritzel
# et al. §4 adopt; the NEC paper states no evaluation epsilon of its own.
# Set 0.0 for pure argmax.
eval_eps: 0.05

# Data collection
frames_per_batch: 1_600
init_random_frames: 50_000
max_frames_per_traj: -1

# Learning schedule
# Gradient steps per collector batch. The paper's ratio is 1 update per 16 raw
# frames; frames_per_batch counts AGENT STEPS, so the right value is
# frames_per_batch * action_repeat / 16. This base config assumes no action
# repeat (1600 / 16 = 100); nec_atari.yaml overrides to 400 for action-repeat 4.
num_updates: 100
