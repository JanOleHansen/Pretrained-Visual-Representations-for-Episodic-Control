name: ALE/MsPacman-v5
gym_backend: gymnasium
gym_kwargs:
  # TorchRL does NOT stack a second action repeat on top of ALE's: GymEnv
  # forwards this straight into `gym.make(..., frameskip=N)` (torchrl
  # envs/libs/gym.py, `kwargs["frameskip"] = self.frame_skip;
  # self.wrapper_frame_skip = 1`) and only falls back to a wrapper-level repeat
  # if gym.make REJECTS the kwarg — which ALE-v5 does not. So this value IS the
  # ALE action repeat, and 4 is what Pritzel et al. (2017) §4 specifies ("the
  # same preprocessing steps as (Mnih et al., 2015), including repeating each
  # action four times"). One agent step == 4 raw ALE frames.
  #
  # This was `1` until it was caught in review, which meant NEC Ms. Pac-Man ran
  # with NO action repeat at all and every frame-denominated number downstream
  # (total_frames, eval cadence, num_updates, StepCounter.max_steps) was off by
  # 4x. Verify with:
  #   GymEnv("ALE/MsPacman-v5", frame_skip=4).wrapper_frame_skip  -> 1
  frame_skip: 4
  # ALE v5 defaults to 0.25 sticky actions (Machado et al. 2018). The 2017 paper
  # predates that protocol, so disable it for comparable results.
  repeat_action_probability: 0.0
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: true

# NEC variant of mspacman_train.yaml.
#
# KEY DIFFERENCE — no SignTransform (no reward clipping). Pritzel et al. (2017)
# §4: "NEC and MFEC do not require reward clipping, which results in qualitative
# changes in behaviour and better performance relative to other algorithms on
# games requiring clipping (Bowling, Frostbite, H.E.R.O., Ms. Pac-Man, Alien out
# of the seven shown)."  Ms. Pac-Man is named explicitly, and the paper explains
# why: eating a power pill makes ghosts vulnerable and yields rewards far larger
# than ordinary pellets, but "clipping implies there is no difference between
# large and small rewards", so a clipped agent never learns to prefer it.
# Clipping here would remove the exact behaviour the paper credits for NEC's
# Ms. Pac-Man result, so this config must not use SignTransform.
#
# EndOfLifeTransform is kept for parity with the other Atari configs, but be
# aware it is INERT for NEC and MFEC: it writes a separate `end-of-life` key and
# deliberately does NOT touch `done` (its own docstring: "isn't registered
# within the done_spec because it should not instruct the env to reset"), and
# nothing in src/ reads that key. Verified by rollout: with EndOfLifeTransform
# + StepCounter(max_steps=8), `done` fires only at the StepCounter cutoffs and
# `end-of-life` never fires in `next`.
#
# So NEC episodes here are whole games (or StepCounter truncations), NOT
# per-life segments — the paper's Mnih-style episodic-life preprocessing is
# effectively absent. Making it real would mean segmenting on `end-of-life` in
# NECAlgorithm.step(); that is a behaviour change, not a config fix.
#
# VecNorm is omitted for the same reason as the other episodic-control configs:
# its running statistics drift, so the same raw observation encodes differently
# over time, which degrades the DND's exact-match hit rate.
#
# NOTE — reward scale: because clipping is dropped, train/episode_reward here is
# the TRUE Ms. Pac-Man score and is directly comparable to eval/return_mean.
# (In the MFEC Ms. Pac-Man configs train rewards are clipped to {-1, 0, +1} and
# only eval/return_mean is comparable to paper figures.)
transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.EndOfLifeTransform
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.CatFrames
    N: 4
    dim: -3
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.StepCounter
    # 27,000 decisions x 4 emulator frames = the standard 108,000-frame (30 min)
    # ALE episode cap, matching the MFEC configs.  Was 4,500 (5 min), inherited
    # from the DQN-style configs: that cuts a competent agent off mid-game and
    # caps the return the DND can ever observe.  MFEC was fixed; NEC was not.
    max_steps: 27_000
  - _target_: torchrl.envs.DoubleToFloat
