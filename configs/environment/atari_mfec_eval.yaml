name: ALE/MsPacman-v5
gym_backend: gymnasium

# Evaluation counterpart to mspacman_mfec_train.yaml.
#
# Unlike the DQN-style pair (mspacman_train / mspacman_eval), these two configs
# are deliberately *identical*: the paper-faithful MFEC training env already
# has no reward clipping and no life-based episode ends, so there is nothing
# for eval to strip.  That is the point — train/episode_reward and
# eval/return_mean now measure the same quantity (true game score), so a gap
# between them means a real train/eval discrepancy rather than a units
# mismatch.  Kept as a separate file so `environment@eval_environment` stays
# explicit and can diverge later without touching the training env.
gym_kwargs:
  # Both of these must match mspacman_mfec_train.yaml exactly, or the stored
  # QEC keys describe a different environment than the one being evaluated.
  # frame_skip=4 is §4.1's "actions are repeated 4 times"; note TorchRL
  # forwards it to ALE as `frameskip` and overrides the v5 registry default,
  # so omitting it means 1, not 4.  Sticky actions off because MFEC's
  # max-over-returns update cannot handle stochastic transitions
  # (Blundell et al. 2016, footnote 1).
  frame_skip: 4
  repeat_action_probability: 0.0
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: true

transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.StepCounter
    max_steps: 27_000
  - _target_: torchrl.envs.DoubleToFloat