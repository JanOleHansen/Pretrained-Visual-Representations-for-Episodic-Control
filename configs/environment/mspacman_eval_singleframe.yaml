name: ALE/MsPacman-v5
gym_backend: gymnasium
gym_kwargs:
  frame_skip: 4
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: true

# Single-frame eval variant, paired with mspacman_train_singleframe.yaml.
# Drops EndOfLifeTransform + SignTransform like mspacman_eval.yaml, and (like
# mspacman_train_singleframe.yaml) drops CatFrames so "pixels" stays a single
# 84x84 grayscale frame — must match the encoder's expected input shape.
transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.StepCounter
    max_steps: 4500
  - _target_: torchrl.envs.DoubleToFloat
