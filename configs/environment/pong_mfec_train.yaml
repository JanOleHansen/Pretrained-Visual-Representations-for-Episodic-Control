name: ALE/Pong-v5
gym_backend: gymnasium
gym_kwargs:
  frame_skip: 4
  from_pixels: true
  pixels_only: false
  categorical_action_encoding: true

# MFEC variant of pong_train.yaml — identical except VecNorm is omitted.
# VecNorm updates its running mean/std with every collected frame, so the
# same raw pixel observation produces different normalised values at different
# timesteps.  MFEC's exact-match dict relies on bit-identical embeddings for
# re-encountered states; VecNorm makes that impossible and drives
# exact_hit_rate to 0.  The fixed random projection already compresses
# observations adequately without online whitening.
#
# pong_train.yaml keeps VecNorm for DQN pong (where the CNN benefits from
# online normalisation).  Use this file for all MFEC pong runs.
#
# NOTE — reward scale: train/episode_reward reflects *clipped* rewards
# {-1, 0, +1} due to SignTransform.  "21" means ~21 positive reward events,
# not the raw Pong score.  Use eval/return_mean (pong_eval.yaml drops
# SignTransform) for paper comparisons.
transforms:
  - _target_: torchrl.envs.NoopResetEnv
    noops: 30
    random: true
  - _target_: torchrl.envs.EndOfLifeTransform
  - _target_: torchrl.envs.SignTransform
    in_keys: [reward]
  - _target_: torchrl.envs.ToTensorImage
  - _target_: torchrl.envs.GrayScale
  - _target_: torchrl.envs.Resize
    w: 84
    h: 84
  - _target_: torchrl.envs.CatFrames
    N: 4
    dim: -3
  - _target_: torchrl.envs.RewardSum
  - _target_: torchrl.envs.StepCounter
    max_steps: 4500
  - _target_: torchrl.envs.DoubleToFloat
